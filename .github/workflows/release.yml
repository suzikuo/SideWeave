name: SideWeave Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Check release tag matches the app version
        shell: pwsh
        env:
          SIDEWEAVE_OFFICIAL_PUBLISHER_KEY: ${{ vars.SIDEWEAVE_OFFICIAL_PUBLISHER_KEY }}
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($config.version)") {
            throw "Tag $env:GITHUB_REF_NAME must match tauri.conf.json version v$($config.version)"
          }
          if ([string]::IsNullOrWhiteSpace($env:SIDEWEAVE_OFFICIAL_PUBLISHER_KEY)) {
            throw "Set SIDEWEAVE_OFFICIAL_PUBLISHER_KEY before publishing app releases"
          }

      - run: npm ci

      - name: Build and publish the app release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIDEWEAVE_OFFICIAL_PUBLISHER_KEY: ${{ vars.SIDEWEAVE_OFFICIAL_PUBLISHER_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SideWeave ${{ github.ref_name }}
          releaseBody: Windows x64 installer for SideWeave.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Update the fixed updater manifest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/internal/create-update-manifest.py --tag "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --output latest.json
          gh release view update-manifest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create update-manifest --repo $env:GITHUB_REPOSITORY --title "SideWeave update manifest" --notes "Fixed updater manifest asset. This release is not an app version." --target $env:GITHUB_SHA --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Could not create fixed update-manifest release" }
          }
          gh release upload update-manifest latest.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload latest.json to update-manifest release" }
          gh release edit update-manifest --repo $env:GITHUB_REPOSITORY --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Could not keep update-manifest out of GitHub's latest release selection" }
