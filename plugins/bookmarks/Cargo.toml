[package]
name = "agile-tiles-plugin-bookmarks"
version = "1.0.6"
edition = "2021"
description = "Bookmarks plugin for Agile Tiles"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agile-tiles-plugin-api = { path = "../../crates/plugin-api" }
agile-tiles-plugin-sdk = { path = "../../crates/plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
