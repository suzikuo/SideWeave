[package]
name = "sideweave-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "In-process SDK adapter for SideWeave extensions"

[features]
default = []
mock = []

[dependencies]
sideweave-plugin-api = { package = "sideweave-plugin-api", version = "0.1.0", path = "../plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
