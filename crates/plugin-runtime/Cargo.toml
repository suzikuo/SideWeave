[package]
name = "sideweave-plugin-runtime"
version = "0.1.0"
edition = "2021"
description = "Plugin discovery, registry, and lifecycle runtime"

[dependencies]
sideweave-plugin-api = { package = "sideweave-plugin-api", path = "../plugin-api" }
sideweave-plugin-sdk = { package = "sideweave-plugin-sdk", path = "../plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
